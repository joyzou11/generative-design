<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Repetition Letters</title>
    <style>
      :root {
        --page-bg: #f3f3f3;
        --text: #111;
        --gap: clamp(34px, 8vw, 114px);
        --stage-w: min(38vw, 492px);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--page-bg);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
      }

      main {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: clamp(28px, 6vh, 52px) clamp(20px, 6vw, 74px);
      }

      .layout {
        width: min(100%, 1126px);
        display: grid;
        grid-template-columns: minmax(0, var(--stage-w)) minmax(0, var(--stage-w));
        gap: var(--gap);
        align-items: start;
      }

      .panel {
        width: 100%;
      }

      .image-frame {
        position: relative;
        width: 100%;
        aspect-ratio: 612 / 792;
        overflow: hidden;
        background: #fff;
      }

      .image-frame img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
      }

      @media (max-width: 780px) {
        :root {
          --stage-w: min(76vw, 492px);
        }

        main {
          align-items: start;
        }

        .layout {
          grid-template-columns: 1fr;
          gap: 36px;
          justify-items: center;
        }

        .panel {
          max-width: var(--stage-w);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="layout" aria-label="Looping image sequence">
        <div class="panel">
          <div class="image-frame">
            <img id="step-one" src="step1/1.png" alt="Step 1 frame 1" />
          </div>
        </div>

        <div class="panel">
          <div class="image-frame">
            <img id="step-two" src="step2/Letter%20-%201.png" alt="Letter frame 1" />
          </div>
        </div>
      </section>
    </main>

    <script>
      const frameCount = 50;
      const intervalMs = 2000;
      let currentFrame = 1;

      const stepOne = document.querySelector("#step-one");
      const stepTwo = document.querySelector("#step-two");

      const setFrame = (frame) => {
        stepOne.src = `step1/${frame}.png`;
        stepOne.alt = `Step 1 frame ${frame}`;
        stepTwo.src = `step2/Letter%20-%20${frame}.png`;
        stepTwo.alt = `Letter frame ${frame}`;
      };

      for (let frame = 2; frame <= frameCount; frame += 1) {
        const stepOnePreload = new Image();
        stepOnePreload.src = `step1/${frame}.png`;

        const stepTwoPreload = new Image();
        stepTwoPreload.src = `step2/Letter%20-%20${frame}.png`;
      }

      window.setInterval(() => {
        currentFrame = currentFrame === frameCount ? 1 : currentFrame + 1;
        setFrame(currentFrame);
      }, intervalMs);
    </script>
  </body>
</html>
