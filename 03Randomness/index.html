<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Cache-Control" content="no-store">
    <title>Random Type Drift</title>
    <style>
      body {
        background: #ebebeb;
      }

      .info-wrap {
        left: 24px;
        position: fixed;
        top: 24px;
        z-index: 10;
      }

      .info-button {
        background: transparent;
        border: 3px solid #141414;
        color: #141414;
        cursor: default;
        font-family: Helvetica, Arial, sans-serif;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0;
        line-height: 1;
        padding: 12px 22px;
      }

      .info-text {
        background: #ebebeb;
        border: 3px solid #141414;
        color: #141414;
        display: none;
        font-family: Helvetica, Arial, sans-serif;
        font-size: 12px;
        font-weight: 700;
        left: 0;
        line-height: 1.35;
        margin-top: 10px;
        max-width: 620px;
        padding: 16px 18px;
        position: absolute;
        top: 100%;
        width: 620px;
      }

      .info-wrap:hover .info-text {
        display: block;
      }

      canvas {
        border: 0;
        outline: none;
      }

      canvas:focus,
      canvas:focus-visible {
        outline: none;
      }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
    <script src="sketch.js?v=1"></script>
  </head>
  <body>
    <div class="info-wrap">
      <button class="info-button" type="button">INFO</button>
      <div class="info-text">
        A poetic visual typing experiment. Type to gather words at the center; hit SPACE to let the current word scatter. Press ENTER, or keep typing until the line wraps, to pull the letters back home.
      </div>
    </div>
  </body>
</html>
