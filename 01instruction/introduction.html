<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instruction: Square</title>
    <style>
       title {
            text-align: center;
            margin-bottom: 20px;
        }
       body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }
        h1 {
            text-align: center;
            padding: 20px;
            margin-bottom: 20px;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .gallery img {
            width: 100%;
            height: auto;
            object-fit: cover;
            
        }
        @media (max-width: 1200px) {
            .gallery {
                grid-template-columns: repeat(3, 1fr);
            }
        }
        @media (max-width: 768px) {
            .gallery {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <h1>Instruction:Square</h1>
    <div class="gallery">
        <img src="Letter - 1.png" alt="Image 1">
        <img src="Letter - 2.png" alt="Image 2">

</html>
